name: Quality

on:
  push:
    branches:
      - main
      - chatgpt/full-engineering-ui-audit
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Geometry and workspace regressions
        run: pnpm test
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Sites and Vercel production builds
        run: pnpm test:builds
      - name: Network browser acceptance
        run: pnpm test:browser
      - name: Upload browser acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-browser-acceptance
          path: artifacts/network-browser-acceptance.png
          if-no-files-found: ignore
