name: Audit Preview
# Pages preview for audit branch

# Dedicated Pages-preview branch: pushes here deploy the current visual checkpoint.
on:
  push:
    branches:
      - chatgpt/pages-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: thai-street-audit-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static audit preview
        run: pnpm build:pages
      - name: Disable Jekyll
        run: touch .next-pages/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy audit preview
        id: deployment
        uses: actions/deploy-pages@v4
